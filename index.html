<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atari Portal</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/Albatross.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="./assets/fonts/HS_LunaObscura.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/Monowire.otf" as="font" type="font/otf" crossorigin>
  <style>
    @font-face {
      font-family: 'Albatross';
      src: url('./assets/fonts/Albatross.otf') format('opentype');
      font-display: block;
    }
    @font-face {
      font-family: 'HS LunaObscura';
      src: url('./assets/fonts/HS_LunaObscura.woff2') format('woff2'),
           url('./assets/fonts/HS_LunaObscura.otf') format('opentype');
      font-display: block;
    }
    @font-face {
      font-family: 'Monowire';
      src: url('./assets/fonts/Monowire.otf') format('opentype');
      font-display: block;
    }

    /* ── Live reactive variables, updated each frame from JS ───── */
    :root {
      --stage-w: min(94vw, calc(94svh * 16 / 9));
      --stage-h: min(94svh, calc(94vw * 9 / 16));
      --side-gutter-w: calc((100vw - var(--stage-w)) / 2);
      --stage-top: calc((100svh - var(--stage-h)) / 2);

      --bg-energy: 0;     /* 0..1  overall BGM loudness */
      --bg-bass: 0;       /* 0..1  bass band */
      --bg-beat: 0;       /* 0..1  per-beat impulse, decays */
      --bg-focus-x: 0;    /* -1..1 player/pointer X */
      --bg-focus-y: 0;    /* -1..1 player/pointer Y */
      --bg-motion: 0;     /* 0..1  recent focus motion */

      --paper: #f2efe6;
      --ink: #050505;
      --vermilion: #ff3b30;
      --mustard: #f2b705;
      --cyan: #55d6d2;
      --violet: #a944ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      width: 100%;
      height: 100%;
      background: #0a0a1a;
    }
    body {
      width: 100%;
      min-height: 100svh;
      background:
        radial-gradient(circle at 50% 18%, rgba(85, 214, 210, 0.08), transparent 34vw),
        #06060d;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #game-root {
      width: var(--stage-w);
      height: var(--stage-h);
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      image-rendering: pixelated;
      position: relative;
      z-index: 1;
      display: block;
    }

    /* ── Stage background: side gutters as modernist instrument rails ── */
    #stage-bg {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .stage-gutter {
      position: absolute;
      top: var(--stage-top);
      width: var(--side-gutter-w);
      height: var(--stage-h);
      min-width: 26px;
      background:
        linear-gradient(180deg,
          rgba(8, 8, 18, 0.92),
          rgba(14, 8, 14, calc(0.84 + var(--bg-bass) * 0.14)) 60%,
          rgba(8, 8, 18, 0.92));
      box-shadow:
        inset 0 0 0 1px rgba(255, 59, 48, calc(0.32 + var(--bg-beat) * 0.5)),
        inset 0 0 calc(28px + var(--bg-bass) * 60px) rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    .stage-gutter--left  { left: 0; }
    .stage-gutter--right { right: 0; transform: scaleX(-1); }

    /* Live particle / beam / wave canvas (drawn each frame in JS) */
    .stage-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Modernist tick rail on outer edge — static decor */
    .stage-rail {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 8px;
      width: 12px;
      z-index: 2;
      background:
        linear-gradient(90deg, rgba(242, 239, 230, 0.55), transparent 1px),
        repeating-linear-gradient(180deg,
          transparent 0 23px,
          rgba(242, 239, 230, 0.55) 23px 24px,
          transparent 24px 96px,
          rgba(255, 59, 48, 0.85) 96px 97px,
          transparent 97px 100px);
      opacity: calc(0.55 + var(--bg-energy) * 0.3 + var(--bg-beat) * 0.2);
    }

    /* "Data tape" — vertical scrolling strip near inner edge */
    .stage-tape {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      right: 14px;
      z-index: 2;
      background:
        repeating-linear-gradient(180deg,
          rgba(242, 239, 230, 0) 0 8px,
          rgba(242, 239, 230, calc(0.4 + var(--bg-beat) * 0.4)) 8px 9px,
          rgba(242, 239, 230, 0) 9px 14px),
        repeating-linear-gradient(180deg,
          rgba(255, 59, 48, 0) 0 38px,
          rgba(255, 59, 48, 0.85) 38px 41px,
          rgba(255, 59, 48, 0) 41px 76px),
        rgba(8, 8, 18, 0.4);
      animation: tape-scroll calc(6.5s - var(--bg-bass) * 3s - var(--bg-beat) * 1.2s) linear infinite;
      opacity: calc(0.5 + var(--bg-energy) * 0.3);
    }

    /* Mustard signal lamp at top — flashes on beat */
    .stage-lamp {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 18px;
      width: calc(16px + var(--bg-beat) * 14px);
      height: calc(16px + var(--bg-beat) * 14px);
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%,
          rgba(242, 183, 5, calc(0.5 + var(--bg-beat) * 0.5)) 0 40%,
          rgba(242, 183, 5, calc(0.12 + var(--bg-beat) * 0.4)) 60%,
          transparent 100%);
      box-shadow:
        0 0 calc(8px + var(--bg-beat) * 30px) rgba(242, 183, 5, calc(0.6 + var(--bg-beat) * 0.4)),
        0 0 0 1px rgba(8, 8, 18, 0.4);
      animation: lamp-idle 2.8s ease-in-out infinite;
    }

    /* Label plate at bottom */
    .stage-plate {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      padding: 5px 9px;
      background: rgba(242, 239, 230, 0.94);
      color: #050505;
      font-family: 'Monowire', 'Courier New', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      border: 1px solid rgba(5, 5, 5, 0.45);
      border-left: 3px solid var(--vermilion);
      white-space: nowrap;
    }
    .stage-gutter--right .stage-plate {
      transform: translateX(-50%) scaleX(-1);
    }

    @keyframes tape-scroll {
      from { background-position: 0 0, 0 0, 0 0; }
      to   { background-position: 0 -200px, 0 -300px, 0 0; }
    }
    @keyframes lamp-idle {
      0%, 100% { opacity: 0.8; }
      50%      { opacity: 0.55; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage-tape,
      .stage-lamp { animation: none; }
      .stage-canvas { display: none; }
    }

    #three-bg {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 0 !important;
      pointer-events: none !important;
      image-rendering: auto !important;
    }
    #three-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 3 !important;
      pointer-events: none !important;
      image-rendering: auto !important;
    }
  </style>
</head>
<body>
  <div id="stage-bg" aria-hidden="true">
    <div class="stage-gutter stage-gutter--left">
      <div class="stage-rail"></div>
      <div class="stage-tape"></div>
      <div class="stage-lamp"></div>
      <div class="stage-plate">SECTOR&nbsp;7G&nbsp;·&nbsp;PORT&nbsp;01</div>
    </div>
    <div class="stage-gutter stage-gutter--right">
      <div class="stage-rail"></div>
      <div class="stage-tape"></div>
      <div class="stage-lamp"></div>
      <div class="stage-plate">NODE&nbsp;72&nbsp;·&nbsp;PORT&nbsp;02</div>
    </div>
  </div>
  <div id="game-root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
